# Publishes the web app (site/) and the latest data to GitHub Pages. docs/AUTOMATION.md explains it.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/build_site_config.py'
      - 'scripts/stage_site.py'
      - 'scripts/site_settings.py'
      - 'scripts/build_companies.py'
      - 'config/config.yaml'
      - 'config/companies.yaml'
      - 'tests/js/**'
      - 'tests/site/**'
  workflow_dispatch:
  # The daily scan commits data with GITHUB_TOKEN, and GitHub doesn't start other workflows' push
  # runs from such commits. workflow_run is the documented way to run after another workflow.
  # It only fires once this file is on the default branch.
  workflow_run:
    workflows: ['Daily scan']
    types: [completed]
    branches: [main]

# All other permissions become "none" when one is listed.
permissions:
  contents: read
  pages: write
  id-token: write
  # Read-only, to look up when the latest successful Daily scan finished ("Last scan ran").
  actions: read

# One deploy at a time. A newer one waits; a deploy already under way is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run fires on every finished scan; deploy only after a successful one.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to exact commits, as in scan.yml, so a changed tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install requirements
        run: pip install -r requirements.txt

      # The site's own tests. A failure stops the deploy, so the live site stays as it was.
      # The Daily scan's plain `pytest` leaves the `site` tests out (pytest.ini), so only this runs them.
      - name: Test the site
        run: |
          node --test "tests/js/*.test.mjs"
          pytest -m site

      # "Last scan ran" on the site. data/meta.json is only committed on days the data changed (D-023),
      # so it can be older than the latest scan. A run started by a finished Daily scan uses that run's
      # updated_at (its finish time; runs have no completed_at field). Other deploys ask the API for the
      # latest successful Daily scan on main. If anything fails, the value is empty and the site shows
      # only "Data updated": never a made-up time.
      - name: Find when the last Daily scan finished
        id: last_scan
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_TIME: ${{ github.event.workflow_run.updated_at }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            when="$TRIGGER_TIME"
          else
            when="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scan.yml --branch main --status success \
              --limit 1 --json updatedAt --jq '.[0].updatedAt // ""')"
          fi
          echo "time=$when" >> "$GITHUB_OUTPUT"
          echo "Last successful Daily scan: ${when:-unknown}"

      - name: Stage the site
        env:
          LAST_SCAN_RAN: ${{ steps.last_scan.outputs.time }}
        run: python scripts/stage_site.py _site --last-scan-ran "$LAST_SCAN_RAN"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

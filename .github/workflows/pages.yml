# Publishes the web app (site/) and the latest data to GitHub Pages. docs/AUTOMATION.md explains it.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/build_site_config.py'
      - 'scripts/stage_site.py'
      - 'config/config.yaml'
  workflow_dispatch:
  # The daily scan commits data with GITHUB_TOKEN, and GitHub doesn't start other workflows' push
  # runs from such commits. workflow_run is the documented way to run after another workflow.
  # It only fires once this file is on the default branch.
  workflow_run:
    workflows: ['Daily scan']
    types: [completed]
    branches: [main]

# All other permissions become "none" when one is listed.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer one waits; a deploy already under way is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # workflow_run fires on every finished scan; deploy only after a successful one.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to exact commits, as in scan.yml, so a changed tag can't change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install requirements
        run: pip install -r requirements.txt

      # The site's own tests. A failure stops the deploy, so the live site stays as it was.
      - name: Test the site
        run: |
          node --test "tests/js/*.test.mjs"
          pytest tests/test_site_config.py

      - name: Stage the site
        run: python scripts/stage_site.py _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

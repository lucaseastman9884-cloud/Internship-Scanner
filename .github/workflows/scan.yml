# The daily scan. docs/AUTOMATION.md explains how to run it, read it, and what a red X means.
name: Daily scan

on:
  schedule:
    # 5:33 AM Central all year: the timezone line handles the CST/CDT change.
    # Not :00 or :30, because GitHub says runs can be delayed at busy times such as the start of each hour.
    - cron: '33 5 * * *'
      timezone: 'America/Chicago'
  workflow_dispatch:
    inputs:
      # Tick this on "Run workflow" to check that the failure email arrives (docs/AUTOMATION.md).
      # A scheduled run has no inputs, so it reads as false there.
      simulate_failure:
        description: 'Fail on purpose after the tests, to test the failure email (no scan, no email, no commit)'
        type: boolean
        default: false

# All other permissions become "none" when one is listed.
permissions:
  contents: write

# A second run waits instead of overlapping, and never cancels a scan already under way.
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Scans can take about 60 minutes because of the polite delays. This leaves room for the rest.
    timeout-minutes: 90
    steps:
      # Pinned to exact commits, so a changed tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install requirements
        run: pip install -r requirements.txt

      # If the tests fail, the job stops here and no data is committed.
      - name: Run tests
        id: tests
        run: pytest

      # Fails right here, so the scan, morning email and commit are skipped as after any real
      # failure, and "Send failure email" below names this step.
      - name: Simulate a failure
        id: simulate_failure
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "::error title=Simulated failure::simulate_failure was ticked, so this run stops here on purpose."
          exit 1

      # Exits non-zero on a crash, or when more than half of live companies fail.
      - name: Run scanner
        id: scan
        run: python -m scanner run

      # Before the commit step, so the "last sent" time it adds to data/meta.json is saved with the data.
      # Secrets go only to the two email steps, as environment variables, and are never printed.
      # A missing secret is a yellow warning, not a failure: the scan's results are still saved.
      - name: Send morning email
        id: email
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m scanner email

      # Runs after a successful scan even if the email failed, so an email problem never loses data.
      - name: Commit data if listings changed
        id: commit
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        run: python scripts/commit_data.py

      - name: Write run summary
        if: always()
        env:
          TESTS: ${{ steps.tests.outcome }}
          SCAN: ${{ steps.scan.outcome }}
          EMAIL: ${{ steps.email.outcome }}
          COMMIT_ACTION: ${{ steps.commit.outputs.action }}
        run: python scripts/run_summary.py --tests "$TESTS" --scan "$SCAN" --email "$EMAIL" --commit-action "$COMMIT_ACTION"

      # Any earlier failure (tests, scan, email or commit) sends a short "Scan failed" email with a link here.
      - name: Send failure email
        id: failure_email
        if: failure()
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTS: ${{ steps.tests.outcome }}
          SIMULATED: ${{ steps.simulate_failure.outcome }}
          SCAN: ${{ steps.scan.outcome }}
          EMAIL: ${{ steps.email.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
        run: >-
          python -m scanner email --failure --run-url "$RUN_URL"
          --outcome "tests=$TESTS" --outcome "simulated failure=$SIMULATED" --outcome "scan=$SCAN"
          --outcome "email=$EMAIL" --outcome "commit=$COMMIT"

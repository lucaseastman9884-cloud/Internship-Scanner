[pytest]
testpaths = tests
pythonpath = .
# P8: a plain `pytest` (what the Daily scan runs) leaves out the web app's tests, so a broken site
# script can never stop a scan. Deploy site runs them with `pytest -m site`. tests/site/conftest.py
# marks everything in tests/site/ as `site`.
addopts = -m "not site"
markers =
    site: web app tests (tests/site/). Run with: pytest -m site

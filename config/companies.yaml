# ats: greenhouse | lever | ashby | smartrecruiters | workday | manual
#   manual = no adapter is planned for this company yet, so it becomes a "check manually" link.
#            notes say why (unconfirmed ATS, blocked page, or an ATS with no adapter).
# board: Greenhouse/SmartRecruiters slug, Workday career-site URL, or careers URL for manual.
#        A manual company may use null when no real careers URL is known.
# cities: target-area cities. notes say whether each was "observed" in a live posting
#         or is only "expected" from the company's known presence (not confirmed).
# priority: 1 = finance-relevant intern roles seen in a target city, 2 = likely fit, 3 = weak or distant fit.
